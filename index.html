<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Proton & Elektron - Yin Yang</title>

<style>

/* =========================================================
   DASAR
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background: linear-gradient(135deg, #E8F4FF 0%, #F3E8FF 50%, #FFF7E6 100%);
    color:#1f2937;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}


/* =========================================================
   HEADER
========================================================= */
.header{
    background:linear-gradient(135deg,#172554,#312e81 55%,#7c3aed);
    color:white;
    border-radius:18px;
    padding:22px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.header h3{
    margin:0 0 8px;
    font-size:18px;
}

.header h1{
    margin:5px 0;
    font-size:30px;
}

.header h2{
    margin:5px 0 15px;
    font-size:18px;
    font-weight:normal;
}

.team{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

.team span{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.18);
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
}



/* =========================================================
   INFO
========================================================= */

.info-bar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:15px 0;
}

.info{
    background:white;
    border-radius:12px;
    padding:12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.info strong{
    display:block;
    font-size:18px;
    margin-top:4px;
}


/* =========================================================
   LEVEL
========================================================= */

.level-box{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.level-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.level-buttons button{
    border:none;
    padding:9px 18px;
    border-radius:10px;
    cursor:pointer;
    background:#e5e7eb;
    color:#111827;
    font-weight:bold;
}

.level-buttons button.active{
    background:#111827;
    color:white;
}


/* =========================================================
   PETUNJUK
========================================================= */

.instructions{
    background:#f9fafb;
    border-left:6px solid #111827;
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:15px;
    line-height:1.6;
}

.instructions summary{
    cursor:pointer;
    font-weight:bold;
    color:#111827;
    user-select:none;
}

.instructions ol{
    margin:10px 0 0 22px;
}


/* =========================================================
   SOAL
========================================================= */

.question{
    background:white;
    border-radius:18px;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.question-title{
    font-size:18px;
    color:#64748b;
}

.question-expression{
    font-size:42px;
    font-weight:bold;
    margin:12px 0;
    color:#111827;
}


/* =========================================================
   SUMBER PARTIKEL
========================================================= */

.source-title{
    font-weight:bold;
    margin-bottom:8px;
    font-size:18px;
}

.sources{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:15px;
}

.source{
    background:white;
    border:2px dashed #9ca3af;
    border-radius:15px;
    padding:15px;
    width:210px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,.07);
}

.source-label{
    font-weight:bold;
    margin-bottom:10px;
    font-size:16px;
}


/* =========================================================
   PROTON
   PUTIH + HITAM
========================================================= */

.proton-symbol{
    width:70px;
    height:70px;

    border-radius:50%;

    background:white;

    border:4px solid #111827;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#111827;

    font-size:42px;
    font-weight:bold;

    cursor:grab;
    user-select:none;

    margin:auto;

    box-shadow:
        0 4px 10px rgba(0,0,0,.25);
}

.proton-symbol:active{
    cursor:grabbing;
    transform:scale(1.08);
}


/* =========================================================
   ELEKTRON
   HITAM + PUTIH
========================================================= */

.elektron-symbol{
    width:70px;
    height:70px;

    border-radius:50%;

    background:#111827;

    border:4px solid #111827;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:42px;
    font-weight:bold;

    cursor:grab;
    user-select:none;

    margin:auto;

    box-shadow:
        0 4px 10px rgba(0,0,0,.25);
}

.elektron-symbol:active{
    cursor:grabbing;
    transform:scale(1.08);
}


/* =========================================================
   YIN YANG NETRAL
========================================================= */

.yinyang{

    width:78px;
    height:78px;

    border-radius:50%;

    position:relative;

    overflow:hidden;

    background:white;

    border:4px solid #111827;

    margin:auto;

    cursor:grab;

    box-shadow:
        0 4px 12px rgba(0,0,0,.3);

}


/*
   Bagian hitam membentuk setengah
   lingkaran Yin-Yang.
*/

.yinyang::before{

    content:"";

    position:absolute;

    width:50%;

    height:100%;

    left:0;

    top:0;

    background:#111827;

}


/*
   Lingkaran kecil bagian atas
*/

.yinyang .yy-top{

    position:absolute;

    width:50%;

    height:50%;

    left:25%;

    top:0;

    background:#111827;

    border-radius:50%;

}


/*
   Lingkaran kecil bagian bawah
*/

.yinyang .yy-bottom{

    position:absolute;

    width:50%;

    height:50%;

    left:25%;

    bottom:0;

    background:white;

    border-radius:50%;

}


/*
   Simbol +
*/

.yinyang .plus{

    position:absolute;

    left:12%;

    top:38%;

    color:white;

    font-size:24px;

    font-weight:bold;

    z-index:5;
}


/*
   Simbol -
*/

.yinyang .minus{

    position:absolute;

    right:12%;

    top:38%;

    color:#111827;

    font-size:24px;

    font-weight:bold;

    z-index:5;
}


/* =========================================================
   PAPAN
========================================================= */

.board-wrapper{
    margin-top:10px;
}

.board-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:8px;
}

.board-title strong{
    font-size:18px;
}

.board{
    height:460px;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(107,114,128,.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(107,114,128,.12) 1px,
            transparent 1px
        );

    background-size:25px 25px;

    background-color:white;

    border:3px solid #111827;

    border-radius:18px;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.05);
}

.board.drag-over{
    background-color:#f3f4f6;
    border-color:#000;
}


/* =========================================================
   PARTIKEL DI PAPAN
========================================================= */

.particle{

    width:44px;
    height:44px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    font-weight:bold;

    position:absolute;

    cursor:pointer;

    user-select:none;

    box-shadow:
        0 3px 8px rgba(0,0,0,.25);

    z-index:20;
}

.particle.proton{

    background:white;

    color:#111827;

    border:3px solid #111827;
}

.particle.elektron{

    background:#111827;

    color:white;

    border:3px solid #111827;
}


/* =========================================================
   PASANGAN NETRAL DI PAPAN
========================================================= */

.neutral-pair{

    width:70px;
    height:70px;

    position:absolute;

    border-radius:50%;

    overflow:hidden;

    background:white;

    border:3px solid #111827;

    cursor:grab;

    box-shadow:
        0 4px 10px rgba(0,0,0,.3);

    z-index:15;

    user-select:none;
}

.neutral-pair .yy-black{

    position:absolute;

    width:50%;

    height:100%;

    left:0;

    top:0;

    background:#111827;
}

.neutral-pair .yy-top{

    position:absolute;

    width:50%;

    height:50%;

    left:25%;

    top:0;

    background:#111827;

    border-radius:50%;
}

.neutral-pair .yy-bottom{

    position:absolute;

    width:50%;

    height:50%;

    left:25%;

    bottom:0;

    background:white;

    border-radius:50%;
}

.neutral-pair .yy-plus{

    position:absolute;

    left:10%;

    top:34%;

    color:white;

    font-size:23px;

    font-weight:bold;

    z-index:4;
}

.neutral-pair .yy-minus{

    position:absolute;

    right:10%;

    top:34%;

    color:#111827;

    font-size:23px;

    font-weight:bold;

    z-index:4;
}

.neutral-pair:hover{

    transform:scale(1.08);

}


/* =========================================================
   STATUS PAPAN
========================================================= */

.board-status{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin-top:10px;
}

.stat{

    background:white;

    border-radius:10px;

    padding:10px;

    text-align:center;

    border:1px solid #e5e7eb;
}

.stat strong{

    display:block;

    font-size:20px;

    margin-top:3px;
}


/* =========================================================
   WARNA
========================================================= */

.black{
    color:#111827;
}

.gray{
    color:#6b7280;
}


/* =========================================================
   BUTTON
========================================================= */

.controls{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:15px;
}

button{

    border:none;

    border-radius:10px;

    padding:12px 18px;

    font-weight:bold;

    cursor:pointer;

    font-size:14px;
}

.btn-neutral{

    background:#111827;

    color:white;
}

.btn-check{

    background:#2563eb;

    color:white;
}

.btn-next{

    background:#4b5563;

    color:white;
}

.btn-reset{

    background:#9ca3af;

    color:white;
}


/* =========================================================
UPDATE PAPAN
========================================================= */

function updateBoard(){

    renderBoard();


    let jumlahProton =
        partikel.filter(
            p =>
            p.type === "proton"
        ).length;


    let jumlahElektron =
        partikel.filter(
            p =>
            p.type === "elektron"
        ).length;


    let nilai =
        jumlahProton -
        jumlahElektron;


    document
        .getElementById("jumlahProton")
        .textContent =
        jumlahProton;


    document
        .getElementById("jumlahElektron")
        .textContent =
        jumlahElektron;


    document
        .getElementById("jumlahPasangan")
        .textContent =
        pasangan.length;


    document
        .getElementById("nilaiPapan")
        .textContent =
        formatNilai(nilai);

}


/* =========================================================
HITUNG NILAI
========================================================= */

function hitungNilaiPapan(){

    let proton =
        partikel.filter(
            p =>
            p.type === "proton"
        ).length;


    let elektron =
        partikel.filter(
            p =>
            p.type === "elektron"
        ).length;


    return proton - elektron;

}


/* =========================================================
CEK JAWABAN
========================================================= */

function cekJawaban(){

    if(gameSelesai){

        return;

    }


    let input =
        document.getElementById("answer");


    if(input.value === ""){

        setStatus(
            "Masukkan jawaban terlebih dahulu.",
            "error"
        );

        return;

    }


    let jawaban =
        Number(input.value);


    let nilaiPapan =
        hitungNilaiPapan();


    if(
        nilaiPapan === jawabanBenar &&
        jawaban === jawabanBenar
    ){

        benar++;

        skor += 10;

        gameSelesai = true;


        setStatus(

            "🎉 BENAR! " +
            formatBilangan(angkaA) +
            " " +
            operator +
            " " +
            formatBilangan(angkaB) +
            " = " +
            formatNilai(jawabanBenar),

            "success"

        );


        tulisLog(
            "> Jawaban benar! +10 poin."
        );


        updateInfo();

    }

    else{

        setStatus(

            "❌ Belum benar. Nilai papan sekarang " +
            formatNilai(nilaiPapan) +
            ". Coba periksa kembali proton dan elektron.",

            "error"

        );

    }

}


/* =========================================================
SOAL BERIKUTNYA
========================================================= */

function soalBerikutnya(){

    if(!gameSelesai){

        setStatus(

            "Selesaikan soal ini terlebih dahulu.",

            "error"

        );

        return;

    }


    nomorSoal++;


    document
        .getElementById("answer")
        .value = "";


    buatSoal();


    setStatus(

        "Soal baru dimulai. Pilih proton atau elektron.",

        "info"

    );


    tulisLog(
        "> Soal berikutnya."
    );

}


/* =========================================================
RESET
========================================================= */

function resetPapan(
    tampilkanStatus = true
){

    partikel = [];

    pasangan = [];

    dragData = null;


    updateBoard();


    if(tampilkanStatus){

        setStatus(
            "Papan telah dikosongkan.",
            "info"
        );


        tulisLog(
            "> Papan di-reset."
        );

    }

}


/* =========================================================
INFO
========================================================= */

function updateInfo(){

    document
        .getElementById("infoLevel")
        .textContent =
        level;


    document
        .getElementById("infoSoal")
        .textContent =
        nomorSoal;


    document
        .getElementById("infoBenar")
        .textContent =
        benar;


    document
        .getElementById("infoSkor")
        .textContent =
        skor;

}


/* =========================================================
STATUS
========================================================= */

function setStatus(
    text,
    type
){

    let status =
        document.getElementById("status");


    status.textContent =
        text;


    status.className =
        "status " + type;

}


/* =========================================================
LOG
========================================================= */

function tulisLog(text){

    let log =
        document.getElementById("log");


    log.innerHTML +=
        "<br>" + text;


    log.scrollTop =
        log.scrollHeight;

}


/* =========================================================
FORMAT NILAI
========================================================= */

function formatNilai(n){

    if(n > 0){

        return "+" + n;

    }

    return n;

}


/* =========================================================
CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/* =========================================================
MULAI
========================================================= */

buatSoal();

updateBoard();

</script>

</body>
</html
