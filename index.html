<script>

/* =========================================================
   SISTEM SUARA / PELAFALAN BAHASA INDONESIA
========================================================= */

function suaraLafal(teks){

    if(!("speechSynthesis" in window)){
        console.warn(
            "Browser tidak mendukung pelafalan suara."
        );
        return;
    }

    /*
       Hentikan suara sebelumnya
       supaya suara tidak bertumpuk.
    */
    window.speechSynthesis.cancel();

    const suara =
        new SpeechSynthesisUtterance(teks);

    suara.lang = "id-ID";

    /*
       Kecepatan dibuat sedikit lebih lambat
       agar cocok untuk siswa.
    */
    suara.rate = 0.88;

    suara.pitch = 1;

    suara.volume = 1;

    window.speechSynthesis.speak(suara);
}


/* =========================================================
   SUARA AKSI
========================================================= */

function suaraTambahProton(){

    suaraLafal(
        "Proton positif satu ditambahkan ke papan."
    );

}


function suaraTambahElektron(){

    suaraLafal(
        "Elektron negatif satu ditambahkan ke papan."
    );

}


function suaraTambahNetron(){

    suaraLafal(
        "Netron, nilainya nol, ditambahkan ke papan."
    );

}


function suaraDelete(type){

    if(type==="proton"){

        suaraLafal(
            "Proton positif satu dihapus dari papan."
        );

    }

    else if(type==="elektron"){

        suaraLafal(
            "Elektron negatif satu dihapus dari papan."
        );

    }

    else if(type==="netron"){

        suaraLafal(
            "Netron, nilainya nol, dihapus dari papan."
        );

    }

}


function suaraPasangan(jumlah){

    if(jumlah===1){

        suaraLafal(
            "Satu proton positif satu dan satu elektron negatif satu membentuk satu pasangan netral. Nilainya nol."
        );

    }

    else{

        suaraLafal(
            jumlah+
            " proton dan "+
            jumlah+
            " elektron membentuk "+
            jumlah+
            " pasangan netral. Nilainya nol."
        );

    }

}


function suaraPisah(jumlah){

    if(jumlah===1){

        suaraLafal(
            "Satu netron dipisahkan menjadi satu proton positif satu dan satu elektron negatif satu."
        );

    }

    else{

        suaraLafal(
            jumlah+
            " netron dipisahkan menjadi "+
            jumlah+
            " proton dan "+
            jumlah+
            " elektron."
        );

    }

}


function suaraBenar(){

    suaraLafal(
        "Jawaban benar! Hebat!"
    );

}


function suaraSalah(){

    suaraLafal(
        "Jawaban salah. Coba periksa kembali susunan proton dan elektronnya."
    );

}


function suaraBelumJawab(){

    suaraLafal(
        "Masukkan jawaban terlebih dahulu."
    );

}


function suaraSoalBerikutnya(){

    suaraLafal(
        "Soal berikutnya."
    );

}


function suaraReset(){

    suaraLafal(
        "Papan telah dikosongkan."
    );

}


/* =========================================================
   VARIABEL GAME
========================================================= */

let level=1;

let nomorSoal=1;

let benar=0;

let skor=0;

let angkaA=-3;

let angkaB=-5;

let operator="-";

let jawabanBenar=2;

let idPartikel=0;

let partikel=[];

let dragData=null;

let gameSelesai=false;


/* =========================================================
   LEVEL
========================================================= */

const levelMax={

    1:5,

    2:10,

    3:15,

    4:20

};


/* =========================================================
   PILIH LEVEL
========================================================= */

function pilihLevel(l){

    level=l;

    document
    .querySelectorAll(
        ".level-buttons button"
    )
    .forEach(
        b=>
        b.classList.remove("active")
    );

    document
    .getElementById(
        "level"+l
    )
    .classList.add("active");

    nomorSoal=1;

    benar=0;

    skor=0;

    buatSoal();

    suaraLafal(
        "Level "+level+"."
    );

}


/* =========================================================
   RANDOM BILANGAN
========================================================= */

function randomBilangan(max){

    let n=
    Math.floor(
        Math.random()*(2*max+1)
    )-max;

    /*
       Hindari angka nol
    */

    if(n===0){
        n=1;
    }

    return n;

}


/* =========================================================
   BUAT SOAL
========================================================= */

function buatSoal(){

    resetPapan(false);

    let max=levelMax[level];

    angkaA=randomBilangan(max);

    angkaB=randomBilangan(max);

    operator=
    Math.random()<.5
    ? "+"
    : "-";

    jawabanBenar=
    operator==="+"
    ? angkaA+angkaB
    : angkaA-angkaB;

    tampilkanSoal();

    gameSelesai=false;

}


/* =========================================================
   FORMAT BILANGAN
========================================================= */

function formatBilangan(n){

    if(n<0){

        return "(−"+
        Math.abs(n)+
        ")";

    }

    return n;

}


/* =========================================================
   TAMPILKAN SOAL
========================================================= */

function tampilkanSoal(){

    document
    .getElementById("question")
    .textContent=

    formatBilangan(angkaA)
    +" "
    +operator
    +" "
    +formatBilangan(angkaB);

    updateInfo();

}


/* =========================================================
   DRAG PROTON
========================================================= */

function dragProton(event){

    dragData={

        type:"particle",

        particleType:"proton"

    };

    event.dataTransfer.effectAllowed="copy";

    event.dataTransfer.setData(
        "text/plain",
        "proton"
    );

}


/* =========================================================
   DRAG ELEKTRON
========================================================= */

function dragElektron(event){

    dragData={

        type:"particle",

        particleType:"elektron"

    };

    event.dataTransfer.effectAllowed="copy";

    event.dataTransfer.setData(
        "text/plain",
        "elektron"
    );

}


/* =========================================================
   DRAG NETRON
========================================================= */

function dragNetron(event){

    dragData={

        type:"netron"

    };

    event.dataTransfer.effectAllowed="copy";

    event.dataTransfer.setData(
        "text/plain",
        "netron"
    );

}


/* =========================================================
   SELESAI DRAG
========================================================= */

function dragSelesai(){

    dragData=null;

}


/* =========================================================
   ALLOW DROP
========================================================= */

function allowBoardDrop(event){

    event.preventDefault();

    document
    .getElementById("board")
    .classList.add("drag-over");

}


/* =========================================================
   DROP KE PAPAN
========================================================= */

function dropBoard(event){

    event.preventDefault();

    document
    .getElementById("board")
    .classList.remove("drag-over");

    if(!dragData){
        return;
    }

    const board=
    document.getElementById("board");

    const rect=
    board.getBoundingClientRect();

    let x=
    event.clientX-
    rect.left-
    22;

    let y=
    event.clientY-
    rect.top-
    22;

    x=clamp(
        x,
        3,
        board.clientWidth-47
    );

    y=clamp(
        y,
        3,
        board.clientHeight-47
    );


    /* =====================================================
       PROTON / ELEKTRON
    ===================================================== */

    if(
        dragData.type==="particle"
    ){

        buatPartikel(
            dragData.particleType,
            x,
            y
        );

        if(
            dragData.particleType==="proton"
        ){

            suaraTambahProton();

            tulisLog(
                "> Proton (+1) ditambahkan."
            );

            setStatus(
                "Proton (+1) ditambahkan ke papan.",
                "info"
            );

        }

        else{

            suaraTambahElektron();

            tulisLog(
                "> Elektron (−1) ditambahkan."
            );

            setStatus(
                "Elektron (−1) ditambahkan ke papan.",
                "info"
            );

        }

    }


    /* =====================================================
       NETRON
    ===================================================== */

    else if(
        dragData.type==="netron"
    ){

        buatNetron(
            x,
            y,
            "langsung"
        );

        suaraTambahNetron();

        tulisLog(
            "> Netron Yin-Yang (0) ditambahkan."
        );

        setStatus(
            "Netron (0) ditambahkan ke papan.",
            "info"
        );

    }


    dragData=null;

    updateBoard();

}


/* =========================================================
   BUAT PARTIKEL
========================================================= */

function buatPartikel(
    type,
    x,
    y
){

    partikel.push({

        id:++idPartikel,

        type:type,

        x:x,

        y:y,

        animasi:true

    });

}


/* =========================================================
   BUAT NETRON
   NETRON SUMBER DAN NETRON GABUNGAN
   MENGGUNAKAN TYPE YANG SAMA
========================================================= */

function buatNetron(
    x,
    y,
    asal="langsung"
){

    partikel.push({

        id:++idPartikel,

        type:"netron",

        x:x,

        y:y,

        asal:asal,

        animasi:true

    });

}


/* =========================================================
   GABUNGKAN PROTON + ELEKTRON
   MENJADI NETRON
========================================================= */

function bentukPasanganNetral(){

    let proton=
    partikel.filter(
        p=>
        p.type==="proton"
    );

    let elektron=
    partikel.filter(
        p=>
        p.type==="elektron"
    );

    let jumlah=
    Math.min(
        proton.length,
        elektron.length
    );


    if(jumlah===0){

        setStatus(
            "Belum ada proton dan elektron yang dapat digabungkan.",
            "error"
        );

        suaraLafal(
            "Belum ada proton dan elektron yang dapat digabungkan."
        );

        return;

    }


    const board=
    document.getElementById("board");


    /*
       Simpan pasangan
    */

    let pasanganGabung=[];


    for(
        let i=0;
        i<jumlah;
        i++
    ){

        pasanganGabung.push({

            proton:proton[i],

            elektron:elektron[i]

        });

    }


    /*
       Hapus proton dan elektron
    */

    let idYangDihapus=[];


    pasanganGabung.forEach(
        pasangan=>{

            idYangDihapus.push(
                pasangan.proton.id
            );

            idYangDihapus.push(
                pasangan.elektron.id
            );

        }
    );


    partikel=
    partikel.filter(
        p=>
        !idYangDihapus.includes(p.id)
    );


    /*
       Bentuk netron pada posisi tengah
    */

    pasanganGabung.forEach(
        pasangan=>{

            let x=
            (
                pasangan.proton.x+
                pasangan.elektron.x
            )/2;

            let y=
            (
                pasangan.proton.y+
                pasangan.elektron.y
            )/2;


            buatNetron(

                clamp(
                    x,
                    5,
                    board.clientWidth-75
                ),

                clamp(
                    y,
                    5,
                    board.clientHeight-75
                ),

                "gabungan"

            );

        }
    );


    /*
       SUARA
    */

    suaraPasangan(jumlah);


    /*
       LOG
    */

    tulisLog(
        "> "+
        jumlah+
        " proton + "+
        jumlah+
        " elektron → "+
        jumlah+
        " netron."
    );


    /*
       STATUS
    */

    setStatus(

        jumlah+
        " proton dan "+
        jumlah+
        " elektron berhasil digabungkan menjadi netron (0).",

        "success"

    );


    updateBoard();

}


/* =========================================================
   PISAHKAN NETRON
========================================================= */

function pisahkanNetron(){

    let netron=
    partikel.filter(
        p=>
        p.type==="netron"
    );


    if(netron.length===0){

        setStatus(
            "Belum ada netron yang dapat dipisahkan.",
            "error"
        );

        suaraLafal(
            "Belum ada netron yang dapat dipisahkan."
        );

        return;

    }


    const board=
    document.getElementById("board");


    let jumlah=
    netron.length;


    /*
       Simpan posisi semua netron
    */

    let posisiNetron=
    netron.map(
        n=>({

            x:n.x,

            y:n.y

        })
    );


    /*
       Hapus semua netron
    */

    partikel=
    partikel.filter(
        p=>
        p.type!=="netron"
    );


    /*
       Setiap netron:
       
             ☯
             ↓
        +1       −1
    */

    posisiNetron.forEach(
        n=>{

            /*
               Proton
            */

            buatPartikel(

                "proton",

                clamp(
                    n.x-28,
                    3,
                    board.clientWidth-47
                ),

                clamp(
                    n.y,
                    3,
                    board.clientHeight-47
                )

            );


            /*
               Elektron
            */

            buatPartikel(

                "elektron",

                clamp(
                    n.x+28,
                    3,
                    board.clientWidth-47
                ),

                clamp(
                    n.y,
                    3,
                    board.clientHeight-47
                )

            );

        }
    );


    /*
       SUARA
    */

    suaraPisah(jumlah);


    /*
       LOG
    */

    tulisLog(

        "> "+
        jumlah+
        " netron → "+
        jumlah+
        " proton + "+
        jumlah+
        " elektron."

    );


    /*
       STATUS
    */

    setStatus(

        jumlah+
        " netron dipisahkan menjadi proton (+1) dan elektron (−1).",

        "success"

    );


    updateBoard();

}


/* =========================================================
   HAPUS PARTIKEL
   CUKUP KLIK PADA PARTIKEL
========================================================= */

function hapusPartikel(id){

    let target=
    partikel.find(
        p=>
        p.id===id
    );


    if(!target){
        return;
    }


    partikel=
    partikel.filter(
        p=>
        p.id!==id
    );


    suaraDelete(
        target.type
    );


    let nama=
    target.type==="proton"
    ? "Proton (+1)"
    : "Elektron (−1)";


    tulisLog(
        "> "+nama+" dihapus."
    );


    setStatus(
        nama+
        " dihapus dari papan.",
        "info"
    );


    updateBoard();

}


/* =========================================================
   HAPUS NETRON
========================================================= */

function hapusNetron(id){

    let target=
    partikel.find(
        p=>
        p.id===id &&
        p.type==="netron"
    );


    if(!target){
        return;
    }


    partikel=
    partikel.filter(
        p=>
        p.id!==id
    );


    suaraDelete(
        "netron"
    );


    tulisLog(
        "> Netron Yin-Yang dihapus."
    );


    setStatus(
        "Netron dihapus dari papan.",
        "info"
    );


    updateBoard();

}


/* =========================================================
   RENDER PAPAN
========================================================= */

function renderBoard(){

    const board=
    document.getElementById("board");


    board.innerHTML="";


    /* =====================================================
       NETRON
    ===================================================== */

    partikel
    .filter(
        p=>
        p.type==="netron"
    )
    .forEach(
        n=>{

            let div=
            document.createElement("div");


            /*
               BENTUK NETRON SELALU SAMA
               baik dari sumber maupun hasil gabungan
            */

            div.className=
            "netron-board";


            div.style.left=
            n.x+"px";


            div.style.top=
            n.y+"px";


            div.innerHTML=`

                <div class="yy-black"></div>

                <div class="yy-top"></div>

                <div class="yy-bottom"></div>

                <div class="yy-zero">
                    0
                </div>

            `;


            /*
               Animasi netron baru
            */

            if(n.animasi){

                div.classList.add(
                    "animasi-muncul"
                );

                /*
                   Supaya animasi tidak terus berjalan
                */

                setTimeout(
                    ()=>{

                        n.animasi=false;

                    },
                    400
                );

            }


            div.title=
            "Netron (0) — klik untuk menghapus";


            div.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    hapusNetron(
                        n.id
                    );

                }
            );


            board.appendChild(div);

        }
    );


    /* =====================================================
       PROTON DAN ELEKTRON
    ===================================================== */

    partikel.forEach(
        p=>{

            if(
                p.type==="netron"
            ){
                return;
            }


            let div=
            document.createElement("div");


            div.className=
            "particle "+
            p.type;


            div.style.left=
            p.x+"px";


            div.style.top=
            p.y+"px";


            div.textContent=
            p.type==="proton"
            ? "+"
            : "−";


            /*
               Animasi partikel baru
            */

            if(p.animasi){

                div.classList.add(
                    "animasi-muncul"
                );

                setTimeout(
                    ()=>{

                        p.animasi=false;

                    },
                    400
                );

            }


            div.title=
            p.type==="proton"
            ? "Klik untuk menghapus proton"
            : "Klik untuk menghapus elektron";


            div.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    hapusPartikel(
                        p.id
                    );

                }
            );


            board.appendChild(div);

        }
    );

}


/* =========================================================
   UPDATE PAPAN
========================================================= */

function updateBoard(){

    renderBoard();


    let jumlahProton=
    partikel.filter(
        p=>
        p.type==="proton"
    ).length;


    let jumlahElektron=
    partikel.filter(
        p=>
        p.type==="elektron"
    ).length;


    let jumlahNetron=
    partikel.filter(
        p=>
        p.type==="netron"
    ).length;


    /*
       Nilai:
       
       Proton   = +1
       Elektron = -1
       Netron   =  0
    */

    let nilai=
    jumlahProton-
    jumlahElektron;


    document
    .getElementById(
        "jumlahProton"
    )
    .textContent=
    jumlahProton;


    document
    .getElementById(
        "jumlahElektron"
    )
    .textContent=
    jumlahElektron;


    document
    .getElementById(
        "jumlahNetron"
    )
    .textContent=
    jumlahNetron;


    /*
       Pasangan netral direpresentasikan
       oleh netron.
    */

    document
    .getElementById(
        "jumlahPasangan"
    )
    .textContent=
    jumlahNetron;


    document
    .getElementById(
        "nilaiPapan"
    )
    .textContent=
    formatNilai(nilai);

}


/* =========================================================
   HITUNG NILAI PAPAN
========================================================= */

function hitungNilaiPapan(){

    let proton=
    partikel.filter(
        p=>
        p.type==="proton"
    ).length;


    let elektron=
    partikel.filter(
        p=>
        p.type==="elektron"
    ).length;


    return proton-elektron;

}


/* =========================================================
   CEK JAWABAN
========================================================= */

function cekJawaban(){

    if(gameSelesai){
        return;
    }


    let input=
    document.getElementById(
        "answer"
    );


    if(input.value===""){

        setStatus(
            "Masukkan jawaban terlebih dahulu.",
            "error"
        );

        suaraBelumJawab();

        return;

    }


    let jawaban=
    Number(input.value);


    let nilaiPapan=
    hitungNilaiPapan();


    /*
       Jawaban harus:
       
       1. sama dengan jawaban matematika
       2. sama dengan nilai yang dibuat di papan
    */

    if(
        nilaiPapan===jawabanBenar &&
        jawaban===jawabanBenar
    ){

        benar++;

        skor+=10;

        gameSelesai=true;


        setStatus(

            "🎉 BENAR! "+
            formatBilangan(angkaA)+
            " "+
            operator+
            " "+
            formatBilangan(angkaB)+
            " = "+
            formatNilai(jawabanBenar),

            "success"

        );


        tulisLog(
            "> Jawaban benar! +10 poin."
        );


        /*
           SUARA BENAR
        */

        suaraBenar();


        updateInfo();

    }

    else{

        setStatus(

            "❌ Belum benar. Nilai papan sekarang "+
            formatNilai(nilaiPapan)+
            ". Coba periksa kembali.",

            "error"

        );


        /*
           SUARA SALAH
        */

        suaraSalah();

    }

}


/* =========================================================
   SOAL BERIKUTNYA
========================================================= */

function soalBerikutnya(){

    if(!gameSelesai){

        setStatus(
            "Selesaikan soal ini terlebih dahulu.",
            "error"
        );

        suaraLafal(
            "Selesaikan soal ini terlebih dahulu."
        );

        return;

    }


    nomorSoal++;


    document
    .getElementById(
        "answer"
    )
    .value="";


    buatSoal();


    setStatus(
        "Soal baru dimulai.",
        "info"
    );


    tulisLog(
        "> Soal berikutnya."
    );


    suaraSoalBerikutnya();

}


/* =========================================================
   RESET PAPAN
========================================================= */

function resetPapan(
    tampilkanStatus=true
){

    partikel=[];

    dragData=null;


    updateBoard();


    if(tampilkanStatus){

        setStatus(
            "Papan telah dikosongkan.",
            "info"
        );


        tulisLog(
            "> Papan di-reset."
        );


        suaraReset();

    }

}


/* =========================================================
   UPDATE INFO
========================================================= */

function updateInfo(){

    document
    .getElementById(
        "infoLevel"
    )
    .textContent=
    level;


    document
    .getElementById(
        "infoSoal"
    )
    .textContent=
    nomorSoal;


    document
    .getElementById(
        "infoBenar"
    )
    .textContent=
    benar;


    document
    .getElementById(
        "infoSkor"
    )
    .textContent=
    skor;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type
){

    let status=
    document.getElementById(
        "status"
    );


    status.textContent=
    text;


    status.className=
    "status "+type;

}


/* =========================================================
   LOG
========================================================= */

function tulisLog(text){

    let log=
    document.getElementById(
        "log"
    );


    log.innerHTML+=
    "<br>"+text;


    log.scrollTop=
    log.scrollHeight;

}


/* =========================================================
   FORMAT NILAI
========================================================= */

function formatNilai(n){

    if(n>0){

        return "+"+n;

    }

    return n;

}


/* =========================================================
   CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/* =========================================================
   MULAI GAME
========================================================= */

buatSoal();

updateBoard();

</script>
